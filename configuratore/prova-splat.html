<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova splat · Corridoio</title>
<!-- [Officina] Pagina di prova: lo splat del corridoio (SOG) disegnato con Spark sopra three.js recente, separato dal simulatore (three r128).
     Serve a controllare scala (griglia di quadrati da 2,95 m), orientamento e peso del file. Si apre con un server locale:
       cd configuratore && python3 -m http.server 8000   →   http://localhost:8000/prova-splat.html
     Opzioni nell'indirizzo: ?file=stanze/NOME.sog, ?spark=VERSIONE, ?fov=, ?focal=, ?pre=, ?blur=, ?std=. -->
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8ecef; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #pannello { position: fixed; top: 10px; left: 10px; background: rgba(15, 18, 22, .82); border: 1px solid #2c333b; border-radius: 8px; padding: 10px 12px; max-width: 320px; }
  #pannello b { color: #7fd1ae; }
  #pannello label { display: block; margin-top: 4px; cursor: pointer; }
  #stato { margin-top: 6px; color: #aab3bb; font-size: 12px; white-space: pre-line; }
  #stato.err { color: #ff8a80; }
</style>
<script>
// La versione di Spark si sceglie dall'indirizzo: ?spark=2.1.0 (default 2.4.0). L'importmap va scritta prima dello script modulo.
{ const sv = new URLSearchParams(location.search).get('spark') || '2.4.0';
  const m = document.createElement('script'); m.type = 'importmap';
  m.textContent = JSON.stringify({ imports: {
    'three': 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js',
    'three/addons/': 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/',
    '@sparkjsdev/spark': `https://sparkjs.dev/releases/spark/${sv}/spark.module.js` } });
  document.head.appendChild(m); }
</script>
</head>
<body>
<div id="pannello">
  <b>Prova splat · Corridoio</b>
  <label><input type="checkbox" id="cGriglia" checked> Griglia 2,95 m sul pavimento</label>
  <label><input type="checkbox" id="cAssi"> Assi (rosso x, verde alto, blu z)</label>
  <label>Altezza griglia <input type="range" id="rGy" min="-0.6" max="0.6" step="0.01" value="0.01" style="width:120px"> <span id="vGy">0,01</span> m</label>
  <div id="stato">Carico lo splat…</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

const stato = document.getElementById('stato');
const dice = (t, err) => { stato.textContent = t; stato.classList.toggle('err', !!err); };
const Q = new URLSearchParams(location.search);
const file = Q.get('file') || 'stanze/corridoio.sog';   // ?file=stanze/NOME.sog per provare uno splat nuovo (SOG v2: si vede come il PLY; il v3 in Spark ha bordi striati)
// Regolazioni di Spark per la qualità, provabili dall'indirizzo: ?pre=0.3 (sfoca di più, per scene senza antialias), ?blur=0.3, ?focal=2 (splat più netti), ?std=3
const num = (k, d) => Q.has(k) ? +Q.get(k) : d;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scena = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(num('fov', 75), innerWidth / innerHeight, 0.05, 400);   // 75° come SuperSplat
// Il corridoio, con l'alto sull'asse y (la conversione ha ruotato lo splat di −90° attorno a x): pavimento a y=0, soffitto a ~7 m.
// Si parte 9 m indietro lungo l'asse x, all'altezza degli occhi.
const centro = new THREE.Vector3(0, 1.4, 0);   // l'origine: lo splat convertito con splat-pianta.py ha il mezzo di un corridoio qui
camera.position.set(-9, 2.4, 1.4);
const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.target.copy(centro); ctrl.enableDamping = true; ctrl.maxPolarAngle = Math.PI * 0.95;

const opz = { renderer };
if (Q.has('pre')) opz.preBlurAmount = num('pre', 0);
if (Q.has('blur')) opz.blurAmount = num('blur', 0);
if (Q.has('focal')) opz.focalAdjustment = num('focal', 1);
if (Q.has('std')) opz.maxStdDev = num('std', Math.sqrt(8));
const spark = new SparkRenderer(opz);
scena.add(spark);

// Griglia di quadrati da 2,95 m, allineata a (0,0): se i giunti del pavimento dello splat coincidono, la scala è giusta.
const LATO = 2.95, N = 24;
const griglia = new THREE.GridHelper(LATO * N, N, 0x00ffaa, 0x00ffaa);
griglia.material.transparent = true; griglia.material.opacity = 0.55; griglia.material.depthTest = false; griglia.renderOrder = 10;
griglia.position.y = 0.01;
scena.add(griglia);
const assi = new THREE.AxesHelper(3); assi.visible = false; assi.material.depthTest = false; assi.renderOrder = 11; scena.add(assi);
document.getElementById('cGriglia').onchange = e => griglia.visible = e.target.checked;
document.getElementById('cAssi').onchange = e => assi.visible = e.target.checked;
document.getElementById('rGy').oninput = e => { griglia.position.y = +e.target.value; document.getElementById('vGy').textContent = (+e.target.value).toFixed(2).replace('.', ','); };

const t0 = performance.now();
const splat = new SplatMesh({ url: file });
scena.add(splat);
splat.initialized.then(() => {
  const n = splat.numSplats ?? splat.packedSplats?.numSplats;
  dice(`${file} · Spark ${Q.get('spark') || '2.4.0'}\n${n ? (n / 1e6).toFixed(2) + ' milioni di splat · ' : ''}caricato in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
}).catch(e => dice(`Errore nel caricare ${file}:\n${e && e.message || e}`, true));

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { ctrl.update(); renderer.render(scena, camera); });
</script>
</body>
</html>
